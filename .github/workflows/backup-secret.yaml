name: "Backup Secret"
on:
  workflow_dispatch:

jobs:
  backup_secret:
    name: "Backup Secret"
    runs-on: ubuntu-latest
    env:
      CIPHER_ALGO: "aes-256-cbc"
      PBKDF2_ITERATIONS: 100000
    steps:
      - name: Create .env file with secret
        run: |
          echo "AI_JSON_CRYPTOKEN='${{ secrets.AI_JSON_CRYPTOKEN }}'" >> .env
          echo "API_SERVER='${{ secrets.API_SERVER }}'" >> .env
          echo "APP_NAME='${{ secrets.APP_NAME }}'" >> .env
          echo "APP_NAME_LOW='${{ secrets.APP_NAME_LOW }}'" >> .env
          echo "AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'" >> .env
          echo "AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}'" >> .env
          echo "AWS_S3_ENDPOINT='${{ secrets.AWS_S3_ENDPOINT }}'" >> .env
          echo "AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'" >> .env
          echo "AZURE_TRANSLATOR_KEY='${{ secrets.AZURE_TRANSLATOR_KEY }}'" >> .env
          echo "CLOUDFLARE_ACCOUNT_ID='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'" >> .env
          echo "CLOUDFLARE_AIG_TOKEN='${{ secrets.CLOUDFLARE_AIG_TOKEN }}'" >> .env
          echo "CLOUDFLARE_API_TOKEN='${{ secrets.CLOUDFLARE_API_TOKEN }}'" >> .env
          echo "CLOUDFLARE_PROJECT_NAME='${{ secrets.CLOUDFLARE_PROJECT_NAME }}'" >> .env
          echo "CODECOV_TOKEN='${{ secrets.CODECOV_TOKEN }}'" >> .env
          echo "CRYPTOKEN='${{ secrets.CRYPTOKEN }}'" >> .env
          echo "DOCKER_PASSWORD='${{ secrets.DOCKER_PASSWORD }}'" >> .env
          echo "DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'" >> .env
          echo "IOS_BUNDLE_ID='${{ secrets.IOS_BUNDLE_ID }}'" >> .env
          echo "IOS_DISTRIBUTION_PROFILE='${{ secrets.IOS_DISTRIBUTION_PROFILE }}'" >> .env
          echo "MACOS_CODESIGN_IDENTITY='${{ secrets.MACOS_CODESIGN_IDENTITY }}'" >> .env
          echo "MACOS_NOTARIZE_JSON='${{ secrets.MACOS_NOTARIZE_JSON }}'" >> .env
          echo "MACOS_P12_BASE64='${{ secrets.MACOS_P12_BASE64 }}'" >> .env
          echo "MACOS_P12_PASSWORD='${{ secrets.MACOS_P12_PASSWORD }}'" >> .env
          echo "MACOS2_P12_BASE64='${{ secrets.MACOS2_P12_BASE64 }}'" >> .env
          echo "MACOS3_P12_BASE64='${{ secrets.MACOS3_P12_BASE64 }}'" >> .env
          echo "MOBILE_PROVISION_PROFILE='${{ secrets.MOBILE_PROVISION_PROFILE }}'" >> .env
          echo "NPMJS_TOKEN='${{ secrets.NPMJS_TOKEN }}'" >> .env
          echo "ORG_NAME='${{ secrets.ORG_NAME }}'" >> .env
          echo "RENDEZVOUS_SERVER='${{ secrets.RENDEZVOUS_SERVER }}'" >> .env
          echo "RS_PUB_KEY='${{ secrets.RS_PUB_KEY }}'" >> .env
          echo "TURBO_TEAM='${{ secrets.TURBO_TEAM }}'" >> .env
          echo "TURBO_TOKEN='${{ secrets.TURBO_TOKEN }}'" >> .envecho "AI_JSON_CRYPTOKEN='${{ secrets.AI_JSON_CRYPTOKEN }}'" >> .env
          echo "API_SERVER='${{ secrets.API_SERVER }}'" >> .env
          echo "APP_NAME='${{ secrets.APP_NAME }}'" >> .env
          echo "APP_NAME_LOW='${{ secrets.APP_NAME_LOW }}'" >> .env
          echo "AWS_ACCESS_KEY_ID='${{ secrets.AWS_ACCESS_KEY_ID }}'" >> .env
          echo "AWS_S3_BUCKET='${{ secrets.AWS_S3_BUCKET }}'" >> .env
          echo "AWS_S3_ENDPOINT='${{ secrets.AWS_S3_ENDPOINT }}'" >> .env
          echo "AWS_SECRET_ACCESS_KEY='${{ secrets.AWS_SECRET_ACCESS_KEY }}'" >> .env
          echo "AZURE_TRANSLATOR_KEY='${{ secrets.AZURE_TRANSLATOR_KEY }}'" >> .env
          echo "CLOUDFLARE_ACCOUNT_ID='${{ secrets.CLOUDFLARE_ACCOUNT_ID }}'" >> .env
          echo "CLOUDFLARE_AIG_TOKEN='${{ secrets.CLOUDFLARE_AIG_TOKEN }}'" >> .env
          echo "CLOUDFLARE_API_TOKEN='${{ secrets.CLOUDFLARE_API_TOKEN }}'" >> .env
          echo "CLOUDFLARE_PROJECT_NAME='${{ secrets.CLOUDFLARE_PROJECT_NAME }}'" >> .env
          echo "CODECOV_TOKEN='${{ secrets.CODECOV_TOKEN }}'" >> .env
          echo "CRYPTOKEN='${{ secrets.CRYPTOKEN }}'" >> .env
          echo "DOCKER_PASSWORD='${{ secrets.DOCKER_PASSWORD }}'" >> .env
          echo "DOCKER_USERNAME='${{ secrets.DOCKER_USERNAME }}'" >> .env
          echo "IOS_BUNDLE_ID='${{ secrets.IOS_BUNDLE_ID }}'" >> .env
          echo "IOS_DISTRIBUTION_PROFILE='${{ secrets.IOS_DISTRIBUTION_PROFILE }}'" >> .env
          echo "MACOS_CODESIGN_IDENTITY='${{ secrets.MACOS_CODESIGN_IDENTITY }}'" >> .env
          echo "MACOS_NOTARIZE_JSON='${{ secrets.MACOS_NOTARIZE_JSON }}'" >> .env
          echo "MACOS_P12_BASE64='${{ secrets.MACOS_P12_BASE64 }}'" >> .env
          echo "MACOS_P12_PASSWORD='${{ secrets.MACOS_P12_PASSWORD }}'" >> .env
          echo "MACOS2_P12_BASE64='${{ secrets.MACOS2_P12_BASE64 }}'" >> .env
          echo "MACOS3_P12_BASE64='${{ secrets.MACOS3_P12_BASE64 }}'" >> .env
          echo "MOBILE_PROVISION_PROFILE='${{ secrets.MOBILE_PROVISION_PROFILE }}'" >> .env
          echo "NPMJS_TOKEN='${{ secrets.NPMJS_TOKEN }}'" >> .env
          echo "ORG_NAME='${{ secrets.ORG_NAME }}'" >> .env
          echo "RENDEZVOUS_SERVER='${{ secrets.RENDEZVOUS_SERVER }}'" >> .env
          echo "RS_PUB_KEY='${{ secrets.RS_PUB_KEY }}'" >> .env
          echo "TURBO_TEAM='${{ secrets.TURBO_TEAM }}'" >> .env
          echo "TURBO_TOKEN='${{ secrets.TURBO_TOKEN }}'" >> .env
          openssl enc -${CIPHER_ALGO} -a -pbkdf2 -iter ${PBKDF2_ITERATIONS} -salt -pass pass:"${{ secrets.CRYPTOKEN }}" \
              -in .env \
              -out .env.enc
          rm .env

      - name: Upload encrypted .env file as artifact
        uses: actions/upload-artifact@v7
        with:
          name: encrypted-env
          path: .env.enc
